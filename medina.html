<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Dropdowns and Tooltips</title>

    <style>
        /* General styling */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f4f4f4;
            text-align: center;
        }

        h1 {
            color: #333;
            margin-top: 50px;
        }

        /* Navigation menu */
        ul {
            list-style: none;
            margin: 0;
            padding: 0;
            background-color: #333;
        }

        ul li {
            display: inline-block;
            position: relative;
        }

        ul li a {
            display: block;
            color: white;
            padding: 15px 25px;
            text-decoration: none;
        }

        ul li a:hover {
            background-color: #555;
        }

        /* Dropdown menu */
        .dropdown {
            display: none;
            position: absolute;
            background-color: #333;
            min-width: 160px;
            z-index: 1;
        }

        .dropdown li {
            display: block;
        }

        .dropdown li a {
            padding: 12px;
            text-align: left;
        }

        ul li:hover .dropdown {
            display: block;
        }

        /* Tooltip styling */
        .tooltip {
            position: relative;
            display: inline-block;
            margin: 40px;
            padding: 15px 25px;
            background-color: #007bff;
            color: white;
            border-radius: 5px;
            cursor: pointer;
        }

        .tooltip .tooltiptext {
            visibility: hidden;
            width: 180px;
            background-color: #333;
            color: white;
            text-align: center;
            padding: 10px;
            border-radius: 6px;

            position: absolute;
            bottom: 125%;
            left: 50%;
            transform: translateX(-50%);

            opacity: 0;
            transition: opacity 0.3s;
        }

        .tooltip:hover .tooltiptext {
            visibility: visible;
            opacity: 1;
        }

    </style>
</head>

<body>

    <h1>CSS Dropdowns and Tooltips</h1>

    <!-- Navigation Menu -->
    <ul>
        <li><a href="#">Home</a></li>

        <li>
            <a href="#">Services ▼</a>

            <ul class="dropdown">
                <li><a href="#">Web Design</a></li>
                <li><a href="#">Development</a></li>
                <li><a href="#">SEO</a></li>
            </ul>
        </li>

        <li>
            <a href="#">About ▼</a>

            <ul class="dropdown">
                <li><a href="#">Our Team</a></li>
                <li><a href="#">Our Story</a></li>
            </ul>
        </li>

        <li><a href="#">Contact</a></li>
    </ul>

    <!-- Main Content -->
    <h2>Welcome to Our Website!</h2>

    <p>Hover over the button below to see a tooltip.</p>

    <!-- Tooltip -->
    <div class="tooltip">
        Hover Over Me!
        <span class="tooltiptext">
            This is a helpful tooltip message!
        </span>
    </div>

</body>
</html>
